[package]
name = "mymusic"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.19", features = ["backend-android-activity-06"] }
rodio = { version = "0.22", features = ["symphonia-all"] }
lofty = "0.22"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1.19"

# Отладочная сборка тоже оптимизируется, иначе декодер звука будет «заикаться»
[profile.dev]
opt-level = 3

# ───────── Настройки Android (читает cargo-apk) ─────────
[package.metadata.android]
package = "com.example.mymusic"
apk_name = "MyMusic"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.application]
label = "Моя музыка"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

# Нужно, чтобы реально удалять файлы с телефона (на Android 11+ без него удаление чужих файлов запрещено)
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
