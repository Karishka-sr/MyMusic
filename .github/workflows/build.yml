name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Install Android SDK platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" "platforms;android-33"

      - name: Build APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_ROOT"
          cargo apk build --lib --target aarch64-linux-android

      - uses: actions/upload-artifact@v4
        with:
          name: MyMusic-rust-apk
          path: target/debug/apk/*.apk
